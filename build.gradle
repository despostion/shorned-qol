plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    // 26.x is unobfuscated: plain Mojang names, no mappings line
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Keep parser/tracker checks independent of Minecraft and external test libraries.
def parserTestClasses = layout.buildDirectory.dir('parser-test-classes')
tasks.register('compileParserTests', JavaCompile) {
    source fileTree('dev-tests/dev') { include '**/*.java' }
    source fileTree('dev-tests/stubs') { include '**/*.java' }
    source files('src/main/java/dev/shorned/qol/track/TabParser.java',
            'src/main/java/dev/shorned/qol/track/MiningTracker.java',
            'src/main/java/dev/shorned/qol/util/TabExport.java')
    classpath = files()
    destinationDirectory = parserTestClasses
}
tasks.register('parserTest', JavaExec) {
    dependsOn 'compileParserTests'
    classpath = files(parserTestClasses)
    mainClass = 'dev.shorned.qol.track.ParserTest'
}
tasks.register('tabParserSuite', JavaExec) {
    dependsOn 'compileParserTests'
    classpath = files(parserTestClasses)
    mainClass = 'dev.shorned.qol.track.TabParserSuite'
    args file('dev-tests/resources/dwarven-mines-sample.txt').absolutePath
}
tasks.named('check') { dependsOn 'parserTest', 'tabParserSuite' }
